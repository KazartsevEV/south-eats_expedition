name: Build, validate and publish CDN

on:
  push:
    branches: [main]
    paths:
      - "data/source/**"
      - "data/id-registry.json"
      - "scripts/**"
      - ".github/workflows/cdn-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/source/**"
      - "data/id-registry.json"
      - "scripts/**"
      - ".github/workflows/cdn-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expedition-cdn-publish
  cancel-in-progress: true

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build normalized CDN from source
        run: python scripts/build_cdn.py

      - name: Build canonical CDN layer
        run: python scripts/build_canonical_layer.py

      - name: Build recursive project hierarchy
        run: python scripts/augment_hierarchy.py

      - name: Validate source and generated CDN
        run: python scripts/validate_cdn.py public/cdn/v2

      - name: Validate canonical CDN contract
        run: python scripts/validate_canonical.py public/cdn/v2

      - name: Validate recursive hierarchy
        run: python scripts/validate_hierarchy.py public/cdn/v2

      - name: Publish generated CDN from latest main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}: synchronize with current main and rebuild."
            git fetch origin main
            git reset --hard origin/main

            python scripts/build_cdn.py
            python scripts/build_canonical_layer.py
            python scripts/augment_hierarchy.py
            python scripts/validate_cdn.py public/cdn/v2
            python scripts/validate_canonical.py public/cdn/v2
            python scripts/validate_hierarchy.py public/cdn/v2

            git add public/cdn/v2
            if git diff --cached --quiet; then
              echo "CDN is already up to date on current main."
              exit 0
            fi

            git commit -m "Publish CDN from latest main [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main moved during publish; retrying from the new remote head."
          done

          echo "Could not publish after 3 synchronized attempts."
          exit 1
