name: Build, validate and publish CDN

on:
  push:
    branches: [main]
    paths:
      - "data/source/**"
      - "scripts/**"
      - ".github/workflows/cdn-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expedition-cdn-publish
  cancel-in-progress: true

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build normalized CDN from source
        run: python scripts/build_cdn.py

      - name: Validate source and generated CDN
        run: python scripts/validate_cdn.py public/cdn/v2

      - name: Commit generated CDN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cdn/v2
          if git diff --cached --quiet; then
            echo "CDN is already up to date."
          else
            git commit -m "Publish CDN ${GITHUB_SHA::8} [skip ci]"
            git push origin HEAD:main
          fi
