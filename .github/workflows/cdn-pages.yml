name: Build, validate and publish CDN

on:
  push:
    branches: [main]
    paths:
      - "imports/**"
      - "data/source/**"
      - "data/hierarchy/**"
      - "data/geo/**"
      - "data/id-registry.json"
      - "scripts/**"
      - "public/index.html"
      - "public/ui/**"
      - ".github/workflows/cdn-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "imports/**"
      - "data/source/**"
      - "data/hierarchy/**"
      - "data/geo/**"
      - "data/id-registry.json"
      - "scripts/**"
      - "public/index.html"
      - "public/ui/**"
      - ".github/workflows/cdn-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expedition-cdn-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image preview dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Validate imported donor snapshots
        run: python scripts/validate_import_snapshots.py

      - name: Build normalized CDN from source
        run: python scripts/build_cdn.py

      - name: Build canonical CDN layer
        run: python scripts/build_canonical_layer.py

      - name: Build local media mirrors
        run: python scripts/build_media_mirrors.py

      - name: Build local preview binaries
        run: python scripts/build_previews.py

      - name: Build recursive project hierarchy
        run: python scripts/augment_hierarchy.py

      - name: Validate country and regional layer
        run: python scripts/validate_country_layer.py

      - name: Validate source and generated CDN
        run: python scripts/validate_cdn.py public/cdn/v2

      - name: Validate canonical CDN contract
        run: python scripts/validate_canonical.py public/cdn/v2

      - name: Validate reconciled raw field migration
        run: python scripts/validate_raw_field_migration.py public/cdn/v2

      - name: Validate recursive hierarchy
        run: python scripts/validate_hierarchy.py public/cdn/v2

      - name: Validate JSON-driven frontend
        run: python scripts/validate_frontend_data_driven.py

      - name: Build and validate derived maps in scratch CDN
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/expedition-cdn-v2
          cp -a public/cdn/v2 /tmp/expedition-cdn-v2
          python scripts/build_expedition_layers.py /tmp/expedition-cdn-v2
          python scripts/validate_maps.py /tmp/expedition-cdn-v2
          for cc in bn kh la id my mm ph sg th tl vn; do
            python scripts/validate_locality.py public/cdn/v2 --country "$cc" --strict --strict-geo
          done

      - name: Publish generated CDN from latest main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Publish attempt ${attempt}: synchronize with current main and rebuild."
            git fetch origin main
            git reset --hard origin/main

            python scripts/build_cdn.py
            python scripts/build_canonical_layer.py
            python scripts/build_media_mirrors.py
            python scripts/build_previews.py
            python scripts/augment_hierarchy.py
            python scripts/validate_country_layer.py
            python scripts/validate_cdn.py public/cdn/v2
            python scripts/validate_canonical.py public/cdn/v2
            python scripts/validate_raw_field_migration.py public/cdn/v2
            python scripts/validate_hierarchy.py public/cdn/v2
            python scripts/validate_frontend_data_driven.py

            git add public/cdn/v2
            if git diff --cached --quiet; then
              echo "CDN is already up to date on current main."
              exit 0
            fi

            git commit -m "Publish CDN from latest main [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "main moved during publish; retrying from the new remote head."
          done

          echo "Could not publish after 3 synchronized attempts."
          exit 1
