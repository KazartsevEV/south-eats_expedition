name: One-shot Tad Saleuy enrichment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enrich-laos-0039.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/enrich_laos_obj0039.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/laos.json data/id-registry.json
          git commit -m "Expand Tad Saleuy geology and local traditions"
          git pull --rebase origin main
          git push origin HEAD:main
