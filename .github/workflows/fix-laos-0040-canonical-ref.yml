name: One-shot Tham Chang canonical ref fix
on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-laos-0040-canonical-ref.yml"]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python scripts/fix_laos_obj0040_canonical_ref.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/laos.json
          git commit -m "Fix Tham Chang canonical Tourism Laos refs"
          git pull --rebase origin main
          git push origin HEAD:main
