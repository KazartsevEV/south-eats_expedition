name: One-shot Tad Saleuy copy polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/polish-laos-0039-copy.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/polish_laos_obj0039_copy.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/laos.json
          git commit -m "Polish Tad Saleuy narrative"
          git pull --rebase origin main
          git push origin HEAD:main
