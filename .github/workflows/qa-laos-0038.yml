name: One-shot Laos Hintang QA migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qa-laos-0038.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply migration
        run: python scripts/qa_laos_obj0038.py

      - name: Commit canonical source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/laos.json data/id-registry.json
          if git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git commit -m "QA Laos: build full Hintang Archaeological Park card"
          git pull --rebase origin main
          git push origin HEAD:main
