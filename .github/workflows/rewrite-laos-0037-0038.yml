name: One-shot Laos card rewrite

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rewrite-laos-0037-0038.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rewrite cards
        run: python scripts/rewrite_laos_0037_0038.py

      - name: Commit source rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source/laos.json
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "Rewrite Laos Nam Kan and Hintang cards"
          git pull --rebase origin main
          git push origin HEAD:main
