<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="expedition-ui" content="reference-preview-v3">
<title>Expedition Southeast Asia — экспедиционный справочник</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
:root{
  --bg:#0a0d0c;--panel:#111614;--panel2:#171d1a;--panel3:#1e2621;--line:#2a332e;
  --text:#eef4ef;--muted:#91a097;--soft:#c7d0ca;--accent:#d7ff69;--accent2:#8fd7b0;
  --danger:#ffb38f;--shadow:0 28px 80px rgba(0,0,0,.34);--radius:18px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{color:inherit}
a{color:inherit;text-decoration:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,13,12,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1600px;margin:auto;padding:11px 22px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand-mark{width:31px;height:31px;border-radius:50%;border:1px solid #56625b;display:grid;place-items:center;color:var(--accent);font-size:14px}
.nav{display:flex;gap:6px;margin-left:auto;overflow:auto}
.nav button{border:0;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--muted);white-space:nowrap}
.nav button:hover,.nav button.active{background:var(--panel2);color:var(--text)}
.release-pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:var(--muted);font-size:11px;white-space:nowrap}
.shell{max-width:1600px;margin:auto;padding:26px 22px 60px}
.breadcrumb{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:14px}
.breadcrumb button{border:0;background:none;color:inherit;padding:0;cursor:pointer}
.breadcrumb button:hover{color:var(--text)}
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.hero{padding:28px 0 22px}
.hero h1,.page-head h1{font-size:clamp(38px,6vw,86px);line-height:.95;letter-spacing:-.055em;margin:8px 0 15px;max-width:1150px}
.hero p,.page-head p{max-width:900px;color:var(--muted);font-size:17px;margin:0}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pill{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);background:#0f1311;font-size:12px}
.pill b{color:var(--text)}
.layout-map{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:stretch;margin:12px 0 38px}
.map-frame{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-height:570px;position:relative}
#map{height:570px;background:#111613}
.map-overlay{position:absolute;left:14px;top:14px;z-index:500;background:rgba(10,13,12,.88);backdrop-filter:blur(10px);border:1px solid #ffffff1d;border-radius:12px;padding:9px 11px;max-width:270px}
.map-overlay strong{display:block;font-size:13px}
.map-overlay span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.map-side{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.map-side h3{margin:0 0 12px;font-size:17px}
.layer-list{display:grid;gap:7px}
.layer{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--line);border-radius:11px;background:#0f1311}
.layer span:first-child{font-size:13px}
.layer-status{font-size:10px;padding:3px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.layer-status.live{border-color:#53653b;color:#ddffa1}
.layer-status.pending{border-color:#6b5e43;color:#e2c996}
.arch-note{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.section{margin:38px 0}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:15px}
.section-head h2{font-size:28px;letter-spacing:-.035em;margin:0}
.section-head p{margin:0;color:var(--muted);max-width:650px}
.country-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.country-card,.class-card,.region-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px;cursor:pointer;transition:.18s}
.country-card:hover,.class-card:hover,.region-card:hover{transform:translateY(-2px);border-color:#59655f;background:var(--panel2)}
.country-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.country-name{font-size:22px;font-weight:780;letter-spacing:-.025em}
.country-code{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent2)}
.country-stats{display:flex;gap:14px;margin-top:24px;color:var(--muted);font-size:12px}
.country-stats b{display:block;color:var(--text);font-size:22px;line-height:1}
.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) 250px 250px auto;gap:9px;margin:18px 0}
.control{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 12px;border-radius:10px;outline:none}
.control:focus{border-color:#617068}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 13px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--panel2)}
.object-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.object-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;transition:.18s;min-width:0}
.object-card:hover{transform:translateY(-3px);border-color:#59655f}
.preview{height:210px;background:linear-gradient(145deg,#253129,#101512);position:relative;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover;display:block}
.preview-placeholder{width:100%;height:100%;display:grid;place-items:center;color:#6f7d74;font-size:12px;text-align:center;padding:25px}
.preview-badge{position:absolute;left:10px;top:10px;background:rgba(6,8,7,.82);border:1px solid #ffffff1f;border-radius:8px;padding:4px 7px;font-size:10px}
.card-body{padding:14px}
.card-class{color:var(--accent2);font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.card-title{font-size:20px;font-weight:770;line-height:1.12;letter-spacing:-.025em;margin:5px 0 8px}
.card-narrow{color:#bbc5bf;font-size:13px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;min-height:78px}
.card-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.badge{font-size:10px;border:1px solid var(--line);border-radius:7px;padding:4px 6px;color:var(--muted)}
.badge.ok{color:#dcffa2;border-color:#4f603a}
.region-grid,.class-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.region-card h3,.class-card h3{margin:0 0 5px;font-size:16px}
.region-card p,.class-card p{margin:0;color:var(--muted);font-size:12px}
.page-head{padding:22px 0 12px}
.page-head h1{font-size:clamp(38px,5vw,68px)}
.country-map{height:430px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}
.object-hero{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);min-height:420px;position:relative}
.object-hero img{width:100%;height:100%;min-height:420px;max-height:620px;object-fit:cover;display:block}
.object-hero .preview-placeholder{min-height:420px}
.object-main{padding:2px 0}
.object-main h1{font-size:clamp(40px,5vw,72px);line-height:.96;letter-spacing:-.05em;margin:7px 0 14px}
.object-main .lead{font-size:18px;color:#c8d0cb;max-width:900px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.kv>div{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:11px}
.kv small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.11em;margin-bottom:3px}
.copy-section{border-top:1px solid var(--line);padding:20px 0}
.copy-section h2{font-size:21px;margin:0 0 9px}
.copy-section p{color:#cbd3ce;margin:8px 0}
.side-card{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:14px;margin-bottom:12px}
.side-card h3{font-size:15px;margin:0 0 9px}
.side-map{height:280px;border-radius:10px;overflow:hidden;background:#101411}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gallery button{border:0;padding:0;background:none;cursor:pointer}
.gallery img{width:100%;height:220px;object-fit:cover;border-radius:10px;background:var(--panel2)}
.source-list{padding-left:18px;color:var(--muted);font-size:12px}
.source-list li{margin:7px 0}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;color:var(--muted);text-align:center}
.loading{padding:60px 0;color:var(--muted);text-align:center}
.error{padding:30px;border:1px solid #6b3f32;background:#20130f;color:#ffc5a9;border-radius:14px}
.reference-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.reference-card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:17px}
.reference-card h3{margin:0 0 8px;font-size:17px}
.reference-card p{margin:0;color:#cbd3ce}
.fact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
.fact-card h3{margin:0 0 8px;font-size:16px}
.fact-card p,.fact-card li{color:#cbd3ce}
.fact-card ul{margin:7px 0 0;padding-left:18px}
.country-label-marker{background:transparent;border:0;color:#eef4ef;font-weight:800;font-size:12px;text-shadow:0 1px 4px #000,0 0 8px #000;white-space:nowrap}
.map-gap{height:100%;min-height:220px;display:grid;place-items:center;text-align:center;padding:28px;color:var(--muted);background:linear-gradient(145deg,#121814,#0b0f0d);border:1px dashed var(--line);border-radius:inherit}
.map-gap b{display:block;color:var(--text);margin-bottom:4px}
.map-coverage{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.map-link{display:inline-block;margin-top:7px;color:var(--accent);font-weight:750}
.locality-note{border-left:3px solid var(--accent2);padding:10px 12px;background:var(--panel);color:var(--muted);margin:12px 0 18px}
.footer{border-top:1px solid var(--line);padding:22px 0 0;margin-top:50px;color:var(--muted);font-size:11px}
.leaflet-container{font-family:inherit;background:#111613}
.leaflet-control-attribution{font-size:9px!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#121714;color:var(--text)}
.leaflet-popup-content{margin:10px 12px}
.popup-title{font-weight:750;margin-bottom:3px}
.popup-meta{color:var(--muted);font-size:11px}
@media(max-width:1200px){
  .object-grid{grid-template-columns:repeat(3,1fr)}
  .country-grid{grid-template-columns:repeat(2,1fr)}
  .region-grid,.class-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:900px){
  .layout-map,.split{grid-template-columns:1fr}
  .map-side{order:-1}
  .toolbar{grid-template-columns:1fr 1fr}
  .object-grid{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  .topbar-in,.shell{padding-left:14px;padding-right:14px}
  .brand span:last-child{display:none}
  .release-pill{display:none}
  .hero{padding-top:22px}
  .hero h1,.page-head h1{font-size:42px}
  .layout-map{margin-top:8px}
  #map{height:430px}.map-frame{min-height:430px}
  .country-grid,.object-grid,.region-grid,.class-grid{grid-template-columns:1fr}
  .toolbar{grid-template-columns:1fr}
  .preview{height:230px}
  .kv{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr}
  .reference-grid,.fact-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/">
        <span class="brand-mark">E</span>
        <span>Expedition Southeast Asia</span>
      </a>
      <nav class="nav">
        <button data-route="#/">Главная</button>
        <button data-route="#/map">Карта</button>
        <button data-route="#/countries">Страны</button>
        <button data-route="#/classes">Классы</button>
        <button data-route="#/search">Поиск</button>
      </nav>
      <div class="release-pill" id="releasePill">CDN…</div>
    </div>
  </header>
  <main class="shell" id="view"><div class="loading">Читаю структуру CDN…</div></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<script>
(function(){
'use strict';

var CDN='./cdn/v2/';
var COUNTRY={
  bn:{flag:'🇧🇳',name:'Бруней',en:'Brunei'},kh:{flag:'🇰🇭',name:'Камбоджа',en:'Cambodia'},la:{flag:'🇱🇦',name:'Лаос',en:'Laos'},
  id:{flag:'🇮🇩',name:'Индонезия',en:'Indonesia'},my:{flag:'🇲🇾',name:'Малайзия',en:'Malaysia'},mm:{flag:'🇲🇲',name:'Мьянма',en:'Myanmar'},
  th:{flag:'🇹🇭',name:'Таиланд',en:'Thailand'},vn:{flag:'🇻🇳',name:'Вьетнам',en:'Vietnam'},ph:{flag:'🇵🇭',name:'Филиппины',en:'Philippines'},
  sg:{flag:'🇸🇬',name:'Сингапур',en:'Singapore'},tl:{flag:'🇹🇱',name:'Тимор-Лешти',en:'Timor-Leste'}
};
var state={
  release:null,latest:null,manifest:null,objects:[],classes:[],tags:[],geo:[],geoById:{},seaReference:null,
  classById:{},detail:new Map(),media:new Map(),countryData:new Map(),geoDetail:new Map(),boundary:new Map(),mapsIndex:null,mapInstances:[]
};
var view=document.getElementById('view');

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])})}
function ccOf(id){var m=String(id||'').match(/^obj_([a-z]{2})_/);return m?m[1]:''}
function mediaCC(id){var m=String(id||'').match(/^med_([a-z]{2})_/);return m?m[1]:''}
function cname(cc){return COUNTRY[cc]||{flag:'',name:cc.toUpperCase()}}
function className(id){return state.classById[id]||id||'Без класса'}
function coords(c){return c&&c.lat!=null&&c.lon!=null?Number(c.lat).toFixed(5)+', '+Number(c.lon).toFixed(5):'GPS уточняется'}
function validCoord(c){return c&&Number.isFinite(Number(c.lat))&&Number.isFinite(Number(c.lon))}
function elevation(e){
  if(!e)return '—';
  if(e.representative_m!=null)return Math.round(e.representative_m)+' м';
  if(e.min_m!=null||e.max_m!=null)return (e.min_m==null?'?':e.min_m)+'–'+(e.max_m==null?'?':e.max_m)+' м';
  return '—';
}
function access(v){
  var map={walking:'пешком',walk:'пешком',moped:'мопед',motorcycle:'мотоцикл',public_transport:'общественный',ride_hailing:'такси',taxi:'такси',boat:'лодка',car:'авто'};
  var modes=[];
  (v&&v.access_options||[]).forEach(function(x){(x.modes||[]).forEach(function(m){if(modes.indexOf(m)<0)modes.push(m)})});
  return modes.slice(0,4).map(function(x){return map[x]||x}).join(' · ')||'—';
}
async function j(url){
  var r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error(r.status+' '+url);
  return r.json();
}
async function maybe(url){try{return await j(url)}catch(e){return null}}
async function detail(id){
  if(!state.detail.has(id))state.detail.set(id,j(CDN+state.release+'/objects/'+ccOf(id)+'/'+id+'.json').catch(function(){return null}));
  return state.detail.get(id);
}
async function media(id){
  if(!id)return null;
  if(!state.media.has(id))state.media.set(id,j(CDN+state.release+'/media/'+mediaCC(id)+'/'+id+'.json').catch(function(){return null}));
  return state.media.get(id);
}
async function countryData(cc){
  if(!state.countryData.has(cc)){
    var base=CDN+state.release+'/countries/'+cc+'/';
    state.countryData.set(cc,Promise.all([
      maybe(base+'profile.json'),maybe(base+'climate.json'),maybe(base+'travel-rules.json'),maybe(base+'indexes.json')
    ]).then(function(x){return{profile:x[0],climate:x[1],travel:x[2],indexes:x[3]}}));
  }
  return state.countryData.get(cc);
}
async function geoDetail(id){
  if(!state.geoDetail.has(id))state.geoDetail.set(id,maybe(CDN+state.release+'/geo/entities/'+id+'.json'));
  return state.geoDetail.get(id);
}
async function countryBoundary(cc){
  if(!state.boundary.has(cc))state.boundary.set(cc,maybe(CDN+state.release+'/geo/geometries/geo_'+cc+'.geojson'));
  return state.boundary.get(cc);
}

  temperature_context:'Температура',documented_biodiversity:'Биоразнообразие',dangerous_animals:'Опасные животные',poisonous_plants:'Ядовитые растения',
  malaria:'Малярия',mountain_weather:'Горная погода',mount_kinabalu:'Восхождение на Кинабалу',danum:'Долина Данум',kinabatangan:'Кинабантанган',
  expedition:'Экспедиционные риски',security_advisory:'Предупреждения безопасности',lahad_datu_danum:'Лахад-Дату → Данум',

  mean_annual_temperature_c:'Среднегодовая температура, °C',annual_precipitation_mm:'Осадки за год, мм',annual_precipitation_uncertainty_mm:'Неопределённость осадков, мм',
  data_basis:'Основа данных',caveat:'Ограничения данных',best_period:'Предпочтительный период',role:'Роль в логистике',
  rail:'Железная дорога',water:'Водный транспорт',police_district_2023:'Данные полицейского округа за 2023 год',
  assault_all:'Преступления против личности',property_all:'Имущественные преступления',date:'Дата среза',unit:'Единица учёта',

  var reports=(d.traveler_reports||[]).map(function(r){return '<p>• '+esc(r.summary||r.text||'')+'</p>'}).join('');
  var vp=(d.visual_recon&&d.visual_recon.viewpoints||[]).map(function(x){return '<p><b>'+esc(x.name||'Точка')+'</b>'+(x.coordinates?' · '+esc(coords(x.coordinates)):'')+'<br>'+esc(x.description||(x.view&&x.view.description)||'')+'</p>'}).join('');
  view.innerHTML=breadcrumb([{label:'Главная',hash:'#/'},{label:c.name,hash:'#/country/'+cc},{label:d.names&&d.names.primary||o.title||id}])+
    '<div class="split"><div><div class="object-hero">'+(cover&&cover.url?'<img src="'+esc(cover.url)+'" referrerpolicy="no-referrer" alt="'+esc(d.names&&d.names.primary||'')+'">':'<div class="preview-placeholder">Локальный preview/cover ещё не опубликован в текущем CDN.</div>')+'</div>'+
    '<div class="object-main"><div class="eyebrow">'+esc(className(d.classification&&d.classification.class_id))+'</div><h1>'+esc(d.names&&d.names.primary||o.title||id)+'</h1><p class="lead">'+esc(d.summary&&d.summary.narrow||'')+'</p>'+
    '<div class="kv"><div><small>GPS</small>'+esc(coords(d.geo&&d.geo.primary_location))+'</div><div><small>Высота</small>'+esc(elevation(d.geo&&d.geo.object_elevation))+'</div><div><small>Доступ</small>'+esc(access(v))+'</div><div><small>Ночёвка</small>'+esc(v.overnight&&v.overnight.status||'—')+'</div></div>'+
    narrativeHTML(d.narrative)+
    '<section class="copy-section"><h2>Как добраться</h2>'+(acc||'<p>Данные доступа пока не структурированы.</p>')+'</section>'+
    '<section class="copy-section"><h2>Вода и ночёвка</h2><p><b>Вода:</b> '+esc(v.water&&v.water.summary||'—')+'</p><p><b>Качество:</b> '+esc(v.water&&v.water.quality||'—')+'</p><p><b>Ночёвка:</b> '+esc(v.overnight&&v.overnight.summary||'—')+'</p></section>'+
    (reports?'<section class="copy-section"><h2>Отчёты путешественников</h2>'+reports+'</section>':'')+
    (d.visual_recon?'<section class="copy-section"><h2>Визуальная разведка</h2><p><b>Лучшее время:</b> '+esc(d.visual_recon.best_time||'—')+'</p>'+vp+'<p><b>Дрон:</b> '+esc(typeof d.visual_recon.drone==='string'?d.visual_recon.drone:(d.visual_recon.drone&&d.visual_recon.drone.legal_status)||'—')+'</p></section>':'')+
    g+s+'</div></div>'+
    '<aside><div class="side-card"><h3>Локальная карта объекта</h3><div class="side-map" id="objectMap"></div></div>'+
    '<div class="side-card"><h3>Структурные связи</h3><p class="popup-meta">object <code>'+esc(id)+'</code></p><p class="popup-meta">geo refs: '+esc((d.geo&&d.geo.region_ids||o.geo_ids||[]).join(', ')||'—')+'</p><p class="popup-meta">media: '+esc((d.media&&d.media.gallery_ids||[]).length)+' gallery refs</p></div>'+
    '<div class="side-card"><h3>QA</h3><p><b>'+esc(d.qa&&d.qa.status||'—')+'</b></p><p class="popup-meta">'+esc(d.qa&&d.qa.last_reviewed_at||d.freshness&&d.freshness.checked_at||'—')+'</p></div></aside></div>';
  bindGo();
  var coord=(d.geo&&d.geo.primary_location)||o.coordinates;
  addBaseMap('objectMap',[{id:id,title:d.names&&d.names.primary||id,class_id:d.classification&&d.classification.class_id,coordinates:coord}],{
    maxZoom:14,singleZoom:13,pad:.2,
    emptyMessage:'GPS объекта пока не нормализован. Пустая или приблизительная карта намеренно не показывается.'
  });
}
function renderSearch(){
  resetMaps();
  view.innerHTML=breadcrumb([{label:'Главная',hash:'#/'},{label:'Поиск'}])+
    '<div class="page-head"><div class="eyebrow">Search</div><h1>Поиск по справочнику</h1><p>Компактный индекс работает без загрузки полных карточек. Полный object JSON открывается только после выбора объекта.</p></div>'+
    '<div class="toolbar"><input class="control" id="q" placeholder="Название, narrow, tag…"><select class="control" id="fClass"><option value="">Все классы</option>'+state.classes.map(function(x){return '<option value="'+esc(x.id)+'">'+esc(x.label_ru||x.id)+'</option>'}).join('')+'</select><select class="control" id="fCountry"><option value="">Все страны</option>'+Object.keys(countryCounts()).sort().map(function(cc){return '<option value="'+cc+'">'+esc(cname(cc).name)+'</option>'}).join('')+'</select><button class="btn" id="resetSearch">Сбросить</button></div>'+
    '<div id="searchCount" class="hero-meta"></div><div id="searchGrid" class="object-grid"></div>';
  bindGo();
  var q=document.getElementById('q'),cl=document.getElementById('fClass'),co=document.getElementById('fCountry');
  function run(){
    var s=(q.value||'').trim().toLowerCase(),a=state.objects.filter(function(o){return(!cl.value||o.class_id===cl.value)&&(!co.value||ccOf(o.id)===co.value)&&(!s||[o.title,o.narrow,o.class_id].concat(o.tag_ids||[]).join(' ').toLowerCase().indexOf(s)>=0)});
    document.getElementById('searchCount').innerHTML='<span class="pill">найдено <b>'+a.length+'</b></span>';
    document.getElementById('searchGrid').innerHTML=a.length?a.map(objectCard).join(''):'<div class="empty">Ничего не найдено.</div>';bindObjectGrid();
  }
  q.oninput=run;cl.onchange=run;co.onchange=run;document.getElementById('resetSearch').onclick=function(){q.value='';cl.value='';co.value='';run()};run();
}
function renderMapPage(){
  resetMaps();
  view.innerHTML=breadcrumb([{label:'Главная',hash:'#/'},{label:'Карта'}])+
    '<div class="page-head"><div class="eyebrow">Map</div><h1>Карта экспедиции</h1><p>Карта показывает только те объекты, у которых в canonical слое есть валидный WGS84 GPS. Непривязанные карточки не создают ложных точек.</p></div>'+
    '<section class="layout-map"><div class="map-frame"><div class="map-overlay"><strong>SEA / map-ready objects</strong><span>Наведите на точку для названия; откройте popup для перехода в карточку.</span></div><div id="map"></div></div>'+
    '<aside class="map-side"><h3>Покрытие</h3>'+mapCoverageHTML(state.objects,'Объекты')+'<div class="layer-list">'+
    '<div class="layer"><span>map-ready objects</span><span class="layer-status live">'+mappedObjects(state.objects).length+'</span></div>'+
    '<div class="layer"><span>без GPS</span><span class="layer-status pending">'+(state.objects.length-mappedObjects(state.objects).length)+'</span></div>'+
    '<div class="layer"><span>geo entities</span><span class="layer-status live">'+state.geo.length+'</span></div>'+
    '<div class="layer"><span>country polygons</span><span class="layer-status pending">pending build</span></div>'+
    '<div class="layer"><span>hydrography</span><span class="layer-status pending">pending build</span></div>'+
    '<div class="layer"><span>routes</span><span class="layer-status pending">pending build</span></div>'+
    '<div class="layer"><span>infrastructure</span><span class="layer-status pending">pending build</span></div>'+
    '<div class="layer"><span>viewpoints</span><span class="layer-status pending">pending build</span></div></div>'+
    '<div class="arch-note">Слой карты — производный. Координаты остаются в canonical entities. Никаких центров городов или стран вместо отсутствующего GPS объекта.</div></aside></section>';
  addBaseMap('map',state.objects,{maxZoom:7,pad:.08,englishOnly:true});bindGo();
}
function router(){
  setActiveNav();resetMaps();
  var h=(location.hash||'#/').replace(/^#/,'');
  var p=h.split('/').filter(Boolean);
  if(!p.length)return renderHome();
  if(p[0]==='map')return renderMapPage();
  if(p[0]==='countries')return renderCountries();
  if(p[0]==='classes')return renderClasses();
  if(p[0]==='search')return renderSearch();
  if(p[0]==='country'&&p[1]&&p[2]==='class'&&p[3])return renderClass(p[3],p[1]);
  if(p[0]==='country'&&p[1])return renderCountry(p[1]);
  if(p[0]==='region'&&p[1])return renderRegion(p[1]);
  if(p[0]==='class'&&p[1])return renderClass(p[1]);
  if(p[0]==='object'&&p[1])return renderObject(p[1]);
  renderHome();
}
async function boot(){
  try{
    state.latest=await j(CDN+'latest.json');state.release=state.latest.release_id;
    var base=CDN+state.release+'/';
    var all=await Promise.all([
      j(base+'manifest.json'),j(base+'search/global.json'),j(base+'taxonomy/object-classes.json'),
      j(base+'taxonomy/tags.json'),j(base+'geo/index.json'),maybe(base+'maps/index.json'),maybe(base+'region/southeast-asia.json')
    ]);
    state.manifest=all[0];state.objects=all[1].objects||[];state.classes=all[2].classes||[];state.tags=all[3].tags||[];
    state.geo=all[4].entities||[];state.mapsIndex=all[5];state.seaReference=all[6];
    state.classById=Object.fromEntries(state.classes.map(function(x){return[x.id,x.label_ru||x.id]}));
    state.geoById=Object.fromEntries(state.geo.map(function(x){return[x.id,x]}));
    document.getElementById('releasePill').textContent=state.release+' · schema '+(state.latest.schema_version||'—');
    router();
  }catch(e){
    view.innerHTML='<div class="error"><b>Не удалось прочитать CDN.</b><br>'+esc(e.message)+'</div>';
  }
}
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){routeTo(b.getAttribute('data-route'))}});
window.addEventListener('hashchange',router);
boot();
})();
</script>
</body>
</html>
